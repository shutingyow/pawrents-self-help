{% extends "base.html" %}

{% block title %}Edit {{ dog.name }} - PawPal{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <a href="/profile" class="inline-flex items-center text-gray-600 hover:text-paw-primary transition">
        <i class="fas fa-arrow-left mr-2"></i>
        Back to Profile
    </a>

    <!-- Header -->
    <div class="text-center">
        {% if dog.photo_url %}
        <img src="{{ dog.photo_url }}" alt="{{ dog.name }}" class="w-24 h-24 rounded-full object-cover mx-auto border-4 border-paw-primary">
        {% else %}
        <span class="text-5xl">🐕</span>
        {% endif %}
        <h1 class="text-2xl font-bold text-gray-800 mt-4">Edit {{ dog.name }}'s Profile</h1>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-xl shadow-sm border p-6">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <!-- Photo Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Dog's Photo</label>
                <div class="flex items-center space-x-4">
                    <div class="w-20 h-20 rounded-xl bg-gray-100 flex items-center justify-center overflow-hidden border-2 border-gray-200">
                        {% if dog.photo_url %}
                        <img src="{{ dog.photo_url }}" alt="{{ dog.name }}" class="w-full h-full object-cover" id="photo-preview">
                        {% else %}
                        <span class="text-3xl" id="photo-placeholder">🐕</span>
                        <img src="" alt="Preview" class="w-full h-full object-cover hidden" id="photo-preview">
                        {% endif %}
                    </div>
                    <div class="flex-1">
                        <label class="cursor-pointer inline-flex items-center px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">
                            <i class="fas fa-camera mr-2"></i>
                            Change Photo
                            <input type="file" name="photo" accept="image/*" class="hidden" id="photo-input">
                        </label>
                        <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF up to 5MB</p>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Dog's Name *</label>
                <input type="text" name="name" required value="{{ dog.name }}"
                       class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Breed</label>
                    <input type="text" name="breed" value="{{ dog.breed }}"
                           class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age (years)</label>
                    <input type="number" name="age" min="0" max="25" value="{{ dog.age }}"
                           class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Size *</label>
                <select name="size" required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
                    <option value="small" {% if dog.size.value == 'small' %}selected{% endif %}>Small (under 10kg)</option>
                    <option value="medium" {% if dog.size.value == 'medium' %}selected{% endif %}>Medium (10-25kg)</option>
                    <option value="large" {% if dog.size.value == 'large' %}selected{% endif %}>Large (over 25kg)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Temperament</label>
                <input type="text" name="temperament" value="{{ dog.temperament }}"
                       class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Care Instructions</label>
                <textarea name="care_instructions" rows="3"
                          class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary resize-none">{{ dog.care_instructions }}</textarea>
            </div>

            <div class="flex space-x-3 pt-4">
                <a href="/profile" class="flex-1 text-center py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition font-medium">
                    Cancel
                </a>
                <button type="submit" class="flex-1 py-3 bg-paw-primary text-white rounded-lg hover:bg-purple-700 transition font-medium">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

    <script>
        // Photo preview
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const placeholder = document.getElementById('photo-placeholder');
                    if (placeholder) placeholder.classList.add('hidden');
                    const preview = document.getElementById('photo-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</div>
{% endblock %}
