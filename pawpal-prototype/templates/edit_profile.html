{% extends "base.html" %}

{% block title %}Edit Profile - PawPal{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <a href="/profile" class="inline-flex items-center text-gray-600 hover:text-paw-primary transition">
        <i class="fas fa-arrow-left mr-2"></i>
        Back to Profile
    </a>

    <!-- Header -->
    <div class="text-center">
        <img src="{{ current_user.profile_photo_url or 'https://via.placeholder.com/100' }}" alt="{{ current_user.display_name }}"
             class="w-24 h-24 rounded-full object-cover mx-auto border-4 border-paw-primary">
        <h1 class="text-2xl font-bold text-gray-800 mt-4">Edit Your Profile</h1>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-xl shadow-sm border p-6">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <!-- Photo Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Profile Photo</label>
                <div class="flex items-center space-x-4">
                    <img src="{{ current_user.profile_photo_url or 'https://via.placeholder.com/80' }}"
                         alt="Current photo" class="w-20 h-20 rounded-full object-cover border-2 border-gray-200"
                         id="photo-preview">
                    <div class="flex-1">
                        <label class="cursor-pointer inline-flex items-center px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">
                            <i class="fas fa-camera mr-2"></i>
                            Choose Photo
                            <input type="file" name="photo" accept="image/*" class="hidden" id="photo-input">
                        </label>
                        <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF up to 5MB</p>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Display Name *</label>
                <input type="text" name="display_name" required value="{{ current_user.display_name }}"
                       class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Block Number</label>
                <select name="location"
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
                    <option value="">Select your block</option>
                    <option value="Block 81" {% if current_user.location == 'Block 81' %}selected{% endif %}>Block 81</option>
                    <option value="Block 83" {% if current_user.location == 'Block 83' %}selected{% endif %}>Block 83</option>
                    <option value="Block 85" {% if current_user.location == 'Block 85' %}selected{% endif %}>Block 85</option>
                    <option value="Block 87" {% if current_user.location == 'Block 87' %}selected{% endif %}>Block 87</option>
                    <option value="Block 89" {% if current_user.location == 'Block 89' %}selected{% endif %}>Block 89</option>
                    <option value="Block 91" {% if current_user.location == 'Block 91' %}selected{% endif %}>Block 91</option>
                    <option value="Block 93" {% if current_user.location == 'Block 93' %}selected{% endif %}>Block 93</option>
                    <option value="Block 95" {% if current_user.location == 'Block 95' %}selected{% endif %}>Block 95</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
                <textarea name="bio" rows="3"
                          class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary resize-none"
                          placeholder="Tell other pawrents about yourself...">{{ current_user.bio }}</textarea>
            </div>

            <div class="flex space-x-3 pt-4">
                <a href="/profile" class="flex-1 text-center py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition font-medium">
                    Cancel
                </a>
                <button type="submit" class="flex-1 py-3 bg-paw-primary text-white rounded-lg hover:bg-purple-700 transition font-medium">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

    <script>
        // Photo preview
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photo-preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</div>
{% endblock %}
