{% extends "base.html" %}

{% block title %}Add Your Dog - PawPal{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <!-- Header -->
    <div class="text-center">
        <span class="text-5xl">🐕</span>
        <h1 class="text-2xl font-bold text-gray-800 mt-4">Add Your Furry Friend</h1>
        <p class="text-gray-500">Tell us about your dog so other pawrents can get to know them!</p>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-xl shadow-sm border p-6">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <!-- Photo Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Dog's Photo</label>
                <div class="flex items-center space-x-4">
                    <div class="w-20 h-20 rounded-xl bg-gray-100 flex items-center justify-center overflow-hidden border-2 border-dashed border-gray-300"
                         id="photo-preview-container">
                        <span class="text-3xl" id="photo-placeholder">🐕</span>
                        <img src="" alt="Preview" class="w-full h-full object-cover hidden" id="photo-preview">
                    </div>
                    <div class="flex-1">
                        <label class="cursor-pointer inline-flex items-center px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">
                            <i class="fas fa-camera mr-2"></i>
                            Choose Photo
                            <input type="file" name="photo" accept="image/*" class="hidden" id="photo-input">
                        </label>
                        <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF up to 5MB</p>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Dog's Name *</label>
                <input type="text" name="name" required
                       class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary"
                       placeholder="e.g., Biscuit">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Breed</label>
                    <input type="text" name="breed"
                           class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary"
                           placeholder="e.g., Corgi">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age (years)</label>
                    <input type="number" name="age" min="0" max="25" value="1"
                           class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Size *</label>
                <select name="size" required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary">
                    <option value="small">Small (under 10kg)</option>
                    <option value="medium" selected>Medium (10-25kg)</option>
                    <option value="large">Large (over 25kg)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Temperament</label>
                <input type="text" name="temperament"
                       class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary"
                       placeholder="e.g., Friendly, energetic, loves belly rubs">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Care Instructions</label>
                <textarea name="care_instructions" rows="3"
                          class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-paw-primary focus:border-paw-primary resize-none"
                          placeholder="e.g., Needs walk twice daily. No chicken in diet."></textarea>
            </div>

            <div class="flex space-x-3 pt-4">
                <a href="/profile" class="flex-1 text-center py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition font-medium">
                    Skip for now
                </a>
                <button type="submit" class="flex-1 py-3 bg-paw-primary text-white rounded-lg hover:bg-purple-700 transition font-medium">
                    Add Dog
                </button>
            </div>
        </form>
    </div>

    <script>
        // Photo preview
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photo-placeholder').classList.add('hidden');
                    const preview = document.getElementById('photo-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</div>
{% endblock %}
