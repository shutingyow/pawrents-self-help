databases:
  - name: pawpal-db
    plan: free
    databaseName: pawpal
    user: pawpal

services:
  - type: web
    name: pawpal
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pawpal-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
